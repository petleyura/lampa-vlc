<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Lampa VLC Player — test harness (Stage 4.1)</title>
    <style>
        html, body { margin: 0; padding: 0; background: #111; color: #ddd; font: 13px/1.4 Consolas, monospace; }
        #out { padding: 12px; white-space: pre-wrap; }
        .pass { color: #4caf50; }
        .fail { color: #ff5252; }
        #lampa-stub { padding: 12px; color: #777; }
    </style>
</head>
<body>
    <div id="lampa-stub">Lampa stub area (імітація каталогу)</div>
    <pre id="out"></pre>

    <!-- ================= Імітація Lampa ================= -->
    <script>
        (function () {
            window.__TEST = {
                aborted: 0,
                standardPlayerStarted: 0,
                controllerCalls: [],
                errors: []
            };

            window.addEventListener('error', function (e) {
                window.__TEST.errors.push(String(e.message || e.error));
            });

            function Bus() {
                var listeners = {};
                return {
                    follow: function (type, fn) {
                        type.split(',').forEach(function (name) {
                            (listeners[name] = listeners[name] || []).push(fn);
                        });
                        return this;
                    },
                    remove: function (type, fn) {
                        var arr = listeners[type] || [];
                        var i = arr.indexOf(fn);
                        if (i >= 0) arr.splice(i, 1);
                        return this;
                    },
                    send: function (type, event) {
                        (listeners[type] || []).slice(0).forEach(function (fn) {
                            fn(event || {});
                        });
                        return this;
                    }
                };
            }

            var controlls = {};
            var activeName = 'content';
            var calls = window.__TEST.controllerCalls;

            controlls.content = { toggle: function () {} };

            var Controller = {
                add: function (name, handlers) { controlls[name] = handlers; },
                toggle: function (name) {
                    if (!controlls[name]) return;
                    var prev = controlls[activeName];
                    if (prev && prev.gone && activeName !== name) prev.gone(name);
                    activeName = name;
                    calls.push(name);
                    var cur = controlls[name];
                    if (cur.toggle) cur.toggle();
                },
                enabled: function () { return { name: activeName, controller: controlls[activeName] }; },
                back: function () { var c = controlls[activeName]; if (c && c.back) c.back(); }
            };

            var Params = {
                values: {
                    player: { inner: 'Вбудований' },
                    player_torrent: { inner: 'Вбудований' },
                    player_iptv: { inner: 'Вбудований' }
                },
                defaults: {
                    player: 'inner',
                    player_torrent: 'inner',
                    player_iptv: 'inner'
                },
                select: function (name, values, def) {
                    this.values[name] = values;
                    this.defaults[name] = def;
                }
            };

            window.Lampa = {
                Listener: Bus(),
                Params: Params,
                Player: {
                    listener: Bus(),
                    play: function () { window.__TEST.standardPlayerStarted++; }
                },
                Controller: Controller,
                Torserver: {
                    toPlayUrl: function (url) { return String(url).replace('&preload', '&play'); }
                },
                Timeline: { update: function () { window.__TEST.timelineUpdated = (window.__TEST.timelineUpdated || 0) + 1; } },
                Background: { theme: function () {} },
                Storage: {
                    _data: {},
                    get: function (key, def) { return key in this._data ? this._data[key] : def; },
                    set: function (key, val) { this._data[key] = val; },
                    field: function (name) {
                        return this.get(name, Params.defaults[name]);
                    }
                }
            };

            // Імітація вже завантаженої Lampa
            window.appready = true;

            // Заглушки медіа-API, щоб тести не залежали від реального декодера
            var media = {
                playCount: 0,
                pauseCount: 0
            };
            window.__TEST.media = media;

            HTMLMediaElement.prototype.play = function () {
                media.playCount++;
                this.__testPaused = false;
                try { this.dispatchEvent(new Event('play')); } catch (e) {}
                return Promise.resolve();
            };
            HTMLMediaElement.prototype.pause = function () {
                media.pauseCount++;
                this.__testPaused = true;
                try { this.dispatchEvent(new Event('pause')); } catch (e) {}
            };
        })();
    </script>

    <!-- ================= Плагін ================= -->
    <script src="../Lampa-VLC-Player.js"></script>

    <!-- ================= Тести ================= -->
    <script>
        (function () {
            var out = document.getElementById('out');
            var results = [];
            var T = window.__TEST;

            function line(ok, name, extra) {
                var cls = ok ? 'pass' : 'fail';
                var text = (ok ? 'PASS' : 'FAIL') + '  ' + name + (extra ? '  [' + extra + ']' : '');
                results.push({ ok: ok, name: name, extra: extra || '' });
                var div = document.createElement('div');
                div.className = cls;
                div.textContent = text;
                out.appendChild(div);
            }

            function wait(ms) {
                return new Promise(function (r) { setTimeout(r, ms); });
            }

            function fireCreate(data) {
                var aborted = false;
                Lampa.Player.listener.send('create', {
                    data: data,
                    abort: function () { aborted = true; T.aborted++; }
                });
                return aborted;
            }

            function key(code) {
                window.dispatchEvent(new KeyboardEvent('keydown', { keyCode: code, which: code, bubbles: true, cancelable: true }));
            }

            function videoEl() { return document.querySelector('.vlc-player video'); }
            function rootEl() { return document.querySelector('.vlc-player'); }
            function panelEl() { return document.querySelector('.vlc-debug'); }

            function debugValue(name) {
                var node = document.querySelector('.vlc-debug [data-d="' + name + '"]');
                return node ? node.textContent.trim() : '';
            }

            function click(selector) {
                var node = document.querySelector(selector);
                if (!node) return false;
                node.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
                return true;
            }

            function menuKeys(key) {
                return Lampa.Params.values[key] ? Object.keys(Lampa.Params.values[key]) : [];
            }

            async function run() {
                await wait(50);

                var api = window.__lampaVlcPlayer;

                /* ---------- 1. Ініціалізація ---------- */
                line(!!api && api.isReady && api.isReady(), '1. Плагін підключено та ініціалізовано', api ? 'v' + api.version : 'no api');

                /* ---------- 2-4. Меню ---------- */
                var keysOk = ['player', 'player_torrent', 'player_iptv'].every(function (k) {
                    return Lampa.Params.values[k] && Lampa.Params.values[k].vlc === 'VLC Player';
                });
                line(keysOk, '2. VLC Player додано в player / player_torrent / player_iptv');

                var before = menuKeys('player').length;
                api.menu.apply();
                api.menu.apply();
                var after = menuKeys('player').length;
                line(before === after && after === 2, '3. Повторна ініціалізація не створює дублікатів', before + '→' + after);

                var defaultsOk = Lampa.Params.defaults.player === 'inner' &&
                                 Lampa.Params.defaults.player_torrent === 'inner' &&
                                 Lampa.Params.defaults.player_iptv === 'inner';
                line(defaultsOk, '4. Стандартні значення налаштувань не змінені', Lampa.Params.defaults.player);

                /* ---------- 5. Негативний сценарій: VLC не вибрано ---------- */
                Lampa.Storage.set('player', 'inner');
                var abortInner = fireCreate({ url: 'http://example.test/movie.mp4', title: 'Inner' });
                await wait(30);
                line(abortInner === false && !rootEl(), '5. Якщо VLC не вибрано — Lampa працює як звичайно');

                /* ---------- 6-7. Позитивний сценарій ---------- */
                Lampa.Storage.set('player', 'vlc');
                var url = 'http://192.168.1.10:8090/stream/Movie.2024.mkv?link=abc&index=3&preload';
                var aborted = fireCreate({ url: url, title: 'Тестовий фільм', card: { title: 'Тестовий фільм' } });
                await wait(50);

                line(aborted === true, '6. VLC вибрано — подія create перехоплена, abort() викликано');
                line(T.standardPlayerStarted === 0 && !document.querySelector('.player'),
                    '7. Стандартний програвач Lampa не створювався');

                var root = rootEl();
                var cs = root ? getComputedStyle(root) : null;
                line(cs && cs.position === 'fixed' && cs.zIndex === '2147483000',
                    '8. Власний контейнер fixed + z-index', cs ? cs.position + '/' + cs.zIndex : 'n/a');

                var video = videoEl();
                var src = video ? (video.getAttribute('src') || '') : '';
                line(!!video && src.indexOf('&play') > -1 && src.indexOf('&preload') === -1,
                    '9. HTML5 Video отримав URL Lampa з &play', src.slice(0, 90));

                /* ---------- 10-13. Debug Panel ---------- */
                var panel = panelEl();
                line(!!panel, '10. Debug Panel створена');

                var title = panel ? panel.querySelector('.vlc-debug__title').textContent.trim() : '';
                line(title === 'VLC PLAYER DEBUG', '11. Заголовок панелі', title);

                line(debugValue('engine') === 'HTML5', '12. Рушій у панелі — HTML5', debugValue('engine'));
                line(debugValue('source') === 'TorrServer', '13. Джерело визначено як TorrServer', debugValue('source'));

                var states = ['INITIALIZING', 'LOADING', 'PLAYING', 'PAUSED', 'BUFFERING', 'ERROR', 'STOPPED'];
                line(states.indexOf(debugValue('state')) > -1, '14. Стан плеєра відображається', debugValue('state'));

                line(debugValue('resolution') === 'N/A', '15. Невідома роздільність — N/A', debugValue('resolution'));
                line(debugValue('speed') === 'N/A', '16. Швидкість без даних — N/A', debugValue('speed'));

                var events = panel ? panel.querySelectorAll('.vlc-debug__log > div').length : 0;
                line(events > 0, '17. Журнал подій заповнюється', 'events=' + events);

                /* ---------- 18. Реальні метрики ---------- */
                if (video) {
                    Object.defineProperty(video, 'duration', { value: 120, configurable: true });
                    Object.defineProperty(video, 'currentTime', { value: 10, writable: true, configurable: true });
                    Object.defineProperty(video, 'videoWidth', { value: 1920, configurable: true });
                    Object.defineProperty(video, 'videoHeight', { value: 1080, configurable: true });
                    Object.defineProperty(video, 'buffered', {
                        value: { length: 1, start: function () { return 0; }, end: function () { return 40; } },
                        configurable: true
                    });
                    video.dispatchEvent(new Event('loadedmetadata'));
                    video.dispatchEvent(new Event('progress'));
                }
                await wait(50);

                line(debugValue('resolution') === '1920×1080', '18. Роздільність із videoWidth/videoHeight', debugValue('resolution'));
                line(debugValue('duration') === '02:00', '19. Тривалість відображається', debugValue('duration'));
                line(debugValue('time') === '00:10', '20. Поточний час відображається', debugValue('time'));
                line(/^30\.0 s$/.test(debugValue('buffer')), '21. Буфер із video.buffered', debugValue('buffer'));

                /* ---------- 21a-21d. Engine / Player Core ---------- */
                var internal = api._internals || {};
                line(!!internal.EngineFactory && !!internal.Html5Engine && Array.isArray(internal.ENGINE_CONTRACT),
                    '21a. EngineFactory / Html5Engine / ENGINE_CONTRACT доступні');

                var session = api.session();
                var engine = session && session.engine;
                line(!!engine && engine.name === 'HTML5', '21b. Player Core створив Html5Engine', engine ? engine.name : 'n/a');

                var contractOk = !!engine && internal.ENGINE_CONTRACT.every(function (method) {
                    return typeof engine[method] === 'function';
                });
                line(contractOk, '21c. Html5Engine реалізує весь контракт');

                var caps = engine && engine.capabilities ? engine.capabilities() : null;
                line(!!caps && typeof caps.audioTracks === 'boolean' && caps.subtitleDelay === false,
                    '21d. capabilities() повертає реальні можливості', caps ? JSON.stringify(caps) : 'n/a');

                line(typeof internal.isAvplayAvailable === 'function' && internal.isAvplayAvailable() === false,
                    '21e. У браузері AVPlay недоступний');
                line(internal.EngineFactory.platformId() === 'html5',
                    '21f. EngineFactory → HTML5 у браузері', internal.EngineFactory.platformId());

                /* ---------- 22. Буферизація ---------- */
                if (video) video.dispatchEvent(new Event('waiting'));
                await wait(30);
                var bufferingState = debugValue('state');
                if (video) video.dispatchEvent(new Event('playing'));
                await wait(30);
                line(bufferingState === 'BUFFERING' && debugValue('state') === 'PLAYING',
                    '22. Стани BUFFERING → PLAYING', bufferingState + '→' + debugValue('state'));

                /* ---------- 23. Панель не блокує керування ---------- */
                var pcs = panel ? getComputedStyle(panel) : null;
                line(pcs && pcs.pointerEvents === 'none', '23. Панель не перехоплює кліки (pointer-events: none)');

                var beforePlay = T.media.playCount;
                click('[data-act="toggle"]');
                await wait(30);
                line(T.media.playCount > beforePlay, '24. Кнопка Play/Pause продовжує працювати');

                /* ---------- 25. Помилка ---------- */
                if (video) {
                    Object.defineProperty(video, 'error', { value: { code: 4 }, configurable: true });
                    video.dispatchEvent(new Event('error'));
                }
                await wait(50);

                var errTitle = debugValue('error');
                line(debugValue('state') === 'ERROR', '25. Стан ERROR після помилки', debugValue('state'));
                line(errTitle.indexOf('4') === 0, '26. Код помилки в панелі', errTitle);
                line(!!document.querySelector('.vlc-error.is-on'), '27. Помилка показана в інтерфейсі');
                line(!!document.querySelector('[data-act="retry"]'), '28. Є кнопка повторної спроби');

                /* ---------- 29-31. Закриття ---------- */
                var prevName = 'content';
                key(27);
                await wait(80);

                line(!rootEl() && !panelEl(), '29. Escape закриває плеєр і видаляє Debug Panel');
                line(document.body.classList.contains('vlc-open') === false, '30. Блокування прокрутки знято');
                line(Lampa.Controller.enabled().name === prevName, '31. Контролер Lampa відновлено',
                    Lampa.Controller.enabled().name);

                /* ---------- 32. Повторний запуск ---------- */
                var aborted2 = fireCreate({ url: 'http://example.test/second.mp4', title: 'Другий' });
                await wait(50);
                line(aborted2 && document.querySelectorAll('.vlc-player').length === 1 &&
                     document.querySelectorAll('.vlc-debug').length === 1,
                    '32. Повторний запуск без дублювання панелей');
                key(27);
                await wait(60);

                /* ---------- 33. Гейт для торентів ---------- */
                Lampa.Storage.set('player', 'inner');
                Lampa.Storage.set('player_torrent', 'vlc');
                var abortTorrent = fireCreate({
                    url: 'http://192.168.1.10:8090/stream/x.mkv?link=h&index=1&play',
                    torrent_hash: 'h',
                    title: 'Torrent'
                });
                await wait(40);
                line(abortTorrent === true && debugValue('source') === 'TorrServer',
                    '33. player_torrent=vlc перехоплює лише торенти', debugValue('source'));

                key(27);
                await wait(60);

                /* ---------- 34. Звичайне відео при player=inner ---------- */
                var abortNormal = fireCreate({ url: 'http://example.test/other.mp4', title: 'Other' });
                await wait(30);
                line(abortNormal === false && !rootEl(), '34. Звичайне відео не перехоплюється, якщо player=inner');

                /* ---------- 35. Без URL ---------- */
                Lampa.Storage.set('player', 'vlc');
                var abortNoUrl = fireCreate({ title: 'Без URL' });
                await wait(30);
                line(abortNoUrl === false && !rootEl(), '35. Без URL керування залишається Lampa');

                /* ---------- 36. Збереження вибору ---------- */
                Lampa.Storage.set('player', 'vlc');
                line(Lampa.Storage.field('player') === 'vlc', '36. Вибір VLC зберігається у Storage');

                /* ---------- 37. Помилок не було ---------- */
                line(T.errors.length === 0, '37. Помилок JavaScript не зафіксовано', T.errors.join(' | '));

                var passed = results.filter(function (r) { return r.ok; }).length;
                var failed = results.length - passed;

                var summary = document.createElement('div');
                summary.id = 'summary';
                summary.textContent = '\nSUMMARY passed=' + passed + ' failed=' + failed + ' total=' + results.length;
                out.appendChild(summary);

                window.__TEST.summary = 'passed=' + passed + ' failed=' + failed;
                window.__TEST.done = true;
            }

            run().catch(function (e) {
                var div = document.createElement('div');
                div.className = 'fail';
                div.textContent = 'HARNESS ERROR: ' + (e && e.stack ? e.stack : e);
                out.appendChild(div);
                window.__TEST.done = true;
                window.__TEST.harnessError = String(e);
            });
        })();
    </script>
</body>
</html>
